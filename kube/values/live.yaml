name: winterflowspace

namespace: winterflowspace
env:
  APP_VERSION: f33df32b8a9880ce9dc706b745d9f9bda2b25f70

deployment:
  - name: winterflowspace
    image: invisibug/winterflowspace
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

service:
  name: winterflowspace
  selector: winterflowspace
  port: 80
  targetPort: 80

httpRoute:
  name: winterflowspace
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: api.winterflowspace.com
  path: /
  serviceName: winterflowspace
  servicePort: 80

