name: winterflowspace

namespace: winterflowspace
env:
  APP_VERSION: 355ab54ba65f0c92750ef3f74d9ef4798f9938a8

deployment:
  - name: winterflowspace-client
    image: invisibug/winterflowspace-client
    ports:
      - port: 80
    # env:
    # Handled in Dockerfile.live

service:
  name: winterflowspace-client
  selector: winterflowspace-client
  port: 80
  targetPort: 80

httpRoute:
  name: winterflowspace-client
  gatewayName: kavanetes-gateway
  gatewayNamespace: nginx-gateway
  host: winterflowspace.com
  path: /
  serviceName: winterflowspace-client
  servicePort: 80

